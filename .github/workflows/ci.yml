name: ci

on:
  push:
    branches:
      - main
      - 260401-feat-debate-assistant-design
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript and tsx
        run: npm install -g typescript tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
