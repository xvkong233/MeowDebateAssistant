[package]
name = "meow-debate-assistant"
version = "0.1.0"
description = "Meow Debate Assistant desktop shell"
authors = ["Meow Debate Assistant"]
edition = "2021"

[lib]
name = "meow_debate_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
